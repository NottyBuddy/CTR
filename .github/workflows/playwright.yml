name: CTR Playwright checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ctr-playwright-main
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check crm-local-ai.js
      - name: Wait for GitHub Pages to serve this build
        run: |
          # App functions live in app.js, not index.html. Check each file in
          # the correct place so this health check does not reject a valid page.
          grep -q "INDINEXT ORBIT" index.html
          # AI panel was intentionally removed from the app; do not gate deployment on it.
          grep -q "dashboardFrom" app.js
          grep -q "toggleNotificationPanel" app.js
          grep -q "themeToggle" index.html
          grep -q "exportCrmData" app.js
          for attempt in $(seq 1 24); do
            status=$(curl --silent --show-error --output /tmp/ctr-home.html --write-out "%{http_code}" https://nottybuddy.github.io/CTR/ 2>/dev/null || true)
            if [ "$status" = "200" ] && grep -q "INDINEXT ORBIT" /tmp/ctr-home.html; then
              echo "CTR page is live (HTTP $status)."
              exit 0
            fi
            echo "Pages not ready (attempt $attempt/24; HTTP ${status:-no-response})."
            if [ -s /tmp/ctr-home.html ]; then head -c 240 /tmp/ctr-home.html; echo; fi
            sleep 15
          done
          echo "::error::GitHub Pages did not return the CTR index.html with HTTP 200 after 6 minutes."
          exit 1
      - name: Install Playwright
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npx playwright test
        env:
          CI: true
          CTR_TEST_EMAIL: ${{ secrets.CTR_TEST_EMAIL }}
          CTR_TEST_PASSWORD: ${{ secrets.CTR_TEST_PASSWORD }}
          CTR_ADMIN_TEST_EMAIL: ${{ secrets.CTR_ADMIN_TEST_EMAIL }}
          CTR_ADMIN_TEST_PASSWORD: ${{ secrets.CTR_ADMIN_TEST_PASSWORD }}
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctr-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
