name: CTR Playwright checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ctr-playwright-main
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for GitHub Pages to serve this build
        run: |
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error https://nottybuddy.github.io/CTR/ -o /tmp/ctr-home.html 2>/dev/null && grep -q "CTR — Calling Team Records" /tmp/ctr-home.html; then
              echo "CTR page is live."
              exit 0
            fi
            echo "Pages not ready yet (attempt $attempt/24); retrying in 15 seconds."
            sleep 15
          done
          echo "::error::GitHub Pages did not serve the expected CTR index.html after 6 minutes."
          exit 1
      - name: Install Playwright
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npx playwright test
        env:
          CI: true
          CTR_TEST_EMAIL: ${{ secrets.CTR_TEST_EMAIL }}
          CTR_TEST_PASSWORD: ${{ secrets.CTR_TEST_PASSWORD }}
          CTR_ADMIN_TEST_EMAIL: ${{ secrets.CTR_ADMIN_TEST_EMAIL }}
          CTR_ADMIN_TEST_PASSWORD: ${{ secrets.CTR_ADMIN_TEST_PASSWORD }}
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctr-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
